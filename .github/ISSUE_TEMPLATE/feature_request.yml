name: 功能建议
description: 想要的新能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先扫一眼 `docs/ROADMAP.md`——里面已经列了计划中的方向，
        也列了**明确不做的事**。如果你的想法落在"不做"那一栏，请先说明
        为什么那个理由不成立。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 请描述问题，而不是直接给方案。这样我们才能判断有没有更合适的解法。
      placeholder: |
        我经常在手机和 Kindle 之间换着看，每次都要手动翻到上次的位置。
        希望进度能自动对齐。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他办法（可选）
      description: 包括"现在凑合能用但不爽"的变通做法。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分
      multiple: true
      options:
        - 阅读体验（翻章、目录、排版）
        - 书架与进度同步
        - 数据源与登录
        - 缓存与预下载
        - 设置界面
        - 打包 / 安装 / 文档
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议不涉及下载、托管或分发小说文本
          required: true
        - label: 这个建议不涉及绕过付费或会员限制
          required: true
